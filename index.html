const MAGIC_LINK_FN = SB_URL + "/functions/v1/send-magic-link";

// ── Supabase client — handles auth, token refresh, session persistence ────────
const sbClient = window.supabase.createClient(SB_URL, SB_KEY, {
  auth: { persistSession: true, autoRefreshToken: true },
});

// Module-level session — kept in sync via onAuthStateChange
// Used to inject the user's token into raw fetch calls so RLS works
let _session = null;

function authHdrs() {
  // Always use the user's session token for DB calls — never fall back to anon key
  // RLS policies require an authenticated session; unauthenticated calls will be rejected
  const token = _session?.access_token;
  if(!token) throw new Error("Not authenticated.");
  return { "Content-Type":"application/json","apikey":SB_KEY,"Authorization":"Bearer "+token };
}

// ── Supabase DB helpers ───────────────────────────────────────────────────────
async function dbFetch(path){
  const r = await fetch(SB_URL+"/rest/v1/"+path,{headers:authHdrs()});
  if(!r.ok) throw new Error("Failed to load.");
  return r.json();
}
async function dbPost(table,body){
  const r = await fetch(SB_URL+"/rest/v1/"+table,{
    method:"POST",
    headers:Object.assign({},authHdrs(),{"Prefer":"return=representation"}),
    body:JSON.stringify(body)
  });
  if(!r.ok) throw new Error("Save failed. Check connection.");
  return r.json();
}
async function dbPatch(table,id,body){
  // Strip auto-generated columns — Supabase rejects updates to identity columns
  const {id:_id, created_at:_ca, ...rest} = body;
  const payload=Object.assign({},rest,{updated_at:new Date().toISOString()});
  const r = await fetch(SB_URL+"/rest/v1/"+table+"?id=eq."+id,{
    method:"PATCH",
    headers:Object.assign({},authHdrs(),{"Prefer":"return=representation"}),
    body:JSON.stringify(payload)
  });
  if(!r.ok){
    const errText=await r.text().catch(()=>"");
    throw new Error("Update failed. "+errText);
  }
  return r.json();
}
async function dbDelete(table,id){
  const r = await fetch(SB_URL+"/rest/v1/"+table+"?id=eq."+id,{method:"DELETE",headers:authHdrs()});
  if(!r.ok) throw new Error("Delete failed. Check connection.");
}
async function dbPatchMany(table,ids,body){
  // Batch update multiple rows by ID array in a single API call
  if(!ids||ids.length===0) return;
  const r = await fetch(SB_URL+"/rest/v1/"+table+"?id=in.("+ids.join(",")+")",{
    method:"PATCH",
    headers:Object.assign({},authHdrs(),{"Prefer":"return=minimal"}),
    body:JSON.stringify(body)
  });
  if(!r.ok) throw new Error("Batch update failed. Check connection.");
}
function fetchRecipes(){
  return dbFetch("recipes?property=eq."+encodeURIComponent(PROPERTY)+"&order=category.asc,name.asc&select=*");
}

// ── Magic link sender — calls edge function, never touches the allowlist ──────
async function sendMagicLink(email){
  const redirectTo = window.location.href.split("#")[0]; // current page without hash
  const r = await fetch(MAGIC_LINK_FN,{
    method:"POST",
    headers:{"Content-Type":"application/json","apikey":SB_KEY,"Authorization":"Bearer "+SB_KEY},
    body:JSON.stringify({email,redirectTo})
  });
  if(!r.ok) throw new Error("Could not send link. Try again.");
  // Always succeeds server-side — don't reveal if email was found
}

// ── Sanitise form before save ─────────────────────────────────────────────────
function sanitise(form){
  return Object.assign({},form,{
    name        : form.name.trim(),
    category    : form.category.trim(),
    yield_amount: form.yield_amount.trim(),
    yield_unit  : form.yield_unit.trim(),
    ingredients : form.ingredients
      .map(i=>({name:i.name.trim(),amount:i.amount.trim(),unit:i.unit.trim()}))
      .filter(i=>i.name),
    method: form.method.map(s=>s.trim()).filter(s=>s),
  });
}

// ── HTML escape ───────────────────────────────────────────────────────────────
function esc(str){
  return String(str||"")
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}

// ── Recipe scaling ────────────────────────────────────────────────────────────
function formatNum(n){
  if(Number.isInteger(n)) return String(n);
  return String(parseFloat((Math.round(n*1000)/1000).toFixed(3)));
}
function scaleAmount(amountStr,multiplier){
  if(multiplier===1) return amountStr;
  const s=String(amountStr||"").trim();
  if(!s) return s;
  const frac=s.match(/^(\d+)\s*\/\s*(\d+)$/);
  if(frac) return formatNum((parseInt(frac[1])/parseInt(frac[2]))*multiplier);
  const num=parseFloat(s);
  if(!isNaN(num)&&String(num)===s.replace(/,/g,".")) return formatNum(num*multiplier);
  return s;
}
function scaleYield(yieldStr,multiplier){
  if(multiplier===1) return yieldStr;
  const s=String(yieldStr||"").trim();
  const num=parseFloat(s);
  return !isNaN(num)?formatNum(num*multiplier):s;
}

  win.document.write(`<!DOCTYPE html><html><head>
<meta charset="UTF-8"/><title>${esc(recipe.name)}${scale>1?" (×"+scale+")":""}</title>
<style>

const CAT_OPTS=["Entrée","Main","Dessert","Sauce","Base","Snack","Bread","Pastry","Beverage","Other"];
const BLANK={name:"",category:"",yield_amount:"",yield_unit:"portions",
  ingredients:[{name:"",amount:"",unit:""}],method:[""]};

function RecipeForm({initial,categories,onSave,onCancel}){
  const [form,setForm]     = useState(()=>initial?Object.assign({},BLANK,initial):BLANK);
  const [saving,setSaving] = useState(false);
  const [err,setErr]       = useState("");
  const isDirty=!!(form.name.trim()||form.ingredients.some(i=>i.name.trim())||form.method.some(s=>s.trim()));
  const set=(k,v)=>setForm(f=>Object.assign({},f,{[k]:v}));
  const setIng=(i,k,v)=>setForm(f=>{const a=[...f.ingredients];a[i]=Object.assign({},a[i],{[k]:v});return Object.assign({},f,{ingredients:a});});
  const addIng=()=>{if(form.ingredients.length>=100)return;setForm(f=>Object.assign({},f,{ingredients:[...f.ingredients,{name:"",amount:"",unit:""}]}));};
  const rmIng=i=>setForm(f=>Object.assign({},f,{ingredients:f.ingredients.filter((_,j)=>j!==i)}));
  const setStep=(i,v)=>setForm(f=>{const a=[...f.method];a[i]=v;return Object.assign({},f,{method:a});});
  const addStep=()=>{if(form.method.length>=50)return;setForm(f=>Object.assign({},f,{method:[...f.method,""]}));};
  const rmStep=i=>setForm(f=>Object.assign({},f,{method:f.method.filter((_,j)=>j!==i)}));

  function handleCancel(){
    if(isDirty&&!window.confirm("Discard changes?"))return;
    onCancel();
  }

  async function handleSave(){
    setErr("");
    const clean=sanitise(form);
    if(!clean.name){setErr("Recipe name is required.");return;}
    if(!clean.ingredients.length){setErr("Add at least one ingredient.");return;}
    if(!clean.method.length){setErr("Add at least one method step.");return;}
    setSaving(true);
    try{await onSave(clean);}
    catch(e){setErr(e.message||"Save failed.");setSaving(false);}
  }

  const allCats=[...new Set([...CAT_OPTS,...categories])].sort();

  return (
    <div>
      <div style={{marginBottom:"1rem"}}>
        <label style={st.lbl}>Recipe Name *</label>
        <input style={Object.assign({},st.input,err&&!form.name.trim()?{borderColor:C.rust}:{})}
          value={form.name} onChange={e=>set("name",e.target.value)}
          placeholder="e.g. Beef Wellington" autoFocus={!initial}/>
      </div>
      <div style={{display:"flex",gap:".75rem",marginBottom:"1rem",flexWrap:"wrap"}}>
        <div style={{flex:"1",minWidth:"140px"}}>
          <label style={st.lbl}>Category</label>
          <select style={st.input} value={form.category} onChange={e=>set("category",e.target.value)}>
            <option value="">Select…</option>
            {allCats.map(c=><option key={c} value={c}>{c}</option>)}
          </select>
        </div>
        <div style={{flex:"1",minWidth:"140px"}}>

              value={step} onChange={e=>setStep(i,e.target.value)} placeholder={"Step "+(i+1)}/>

          </div>
        ))}

          onClick={handleSave} disabled={saving}>{saving?"Saving…":"Save Recipe"}</button>
        <button style={st.btnGhost} onClick={handleCancel} disabled={saving}>Cancel</button>
      </div>
    </div>
  );
}

          onCancel={()=>{setConfirmDelete(false);setDeleteErr("");}}

// ── User management (admin only) ──────────────────────────────────────────────
function UserManagement({onClose}){
  const [users,setUsers]     = useState([]);
  const [loading,setLoading] = useState(true);
  const [err,setErr]         = useState("");
  const [newEmail,setNewEmail] = useState("");
  const [newRole,setNewRole]   = useState("staff");
  const [adding,setAdding]     = useState(false);
  const [addErr,setAddErr]     = useState("");

  useEffect(()=>{loadUsers();},[]);

  async function loadUsers(){
    setLoading(true);setErr("");
    try{
      const {data,error}=await sbClient.from("allowed_emails").select("*").order("email");
      if(error)throw error;
      setUsers(data||[]);
    }catch(e){setErr("Could not load users.");}
    setLoading(false);
  }

  async function handleAdd(){
    const email=newEmail.trim().toLowerCase();
    if(!email||!email.includes("@")){setAddErr("Enter a valid email address.");return;}
    setAdding(true);setAddErr("");
    try{
      const {error}=await sbClient.from("allowed_emails").insert({email,role:newRole});
      if(error){
        if(error.code==="23505") throw new Error("That email is already in the list.");
        throw error;
      }
      setNewEmail("");setNewRole("staff");
      await loadUsers();
    }catch(e){setAddErr(e.message||"Could not add user.");}
    setAdding(false);
  }

  async function handleRoleChange(id,role){
    const {error}=await sbClient.from("allowed_emails").update({role}).eq("id",id);
    if(!error)setUsers(prev=>prev.map(u=>u.id===id?Object.assign({},u,{role}):u));
  }

  async function handleRemove(id,email){
    if(!window.confirm("Remove "+email+" from access list?"))return;
    const {error}=await sbClient.from("allowed_emails").delete().eq("id",id);
    if(!error)setUsers(prev=>prev.filter(u=>u.id!==id));
  }

  return (
    <div style={st.overlay} onClick={e=>{if(e.target===e.currentTarget)onClose();}}>
      <div style={st.modal}>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:"1.5rem"}}>
          <h2 style={{fontSize:"1.1rem",fontWeight:"700",color:C.tPrimary}}>Manage Access</h2>
          <button style={st.btnGhost} onClick={onClose}>Close</button>
        </div>

        {/* Add user */}
        <div style={{background:"rgba(10,20,8,0.4)",border:"1px solid rgba(58,90,42,0.35)",borderRadius:".875rem",padding:"1rem",marginBottom:"1.25rem"}}>
          <label style={Object.assign({},st.lbl,{marginBottom:".75rem"})}>Add person</label>
          <div style={{display:"flex",gap:".5rem",flexWrap:"wrap",marginBottom:".5rem"}}>
            <input style={Object.assign({},st.input,{flex:"2",minWidth:"160px"})}
              placeholder="email@example.com" value={newEmail}
              onChange={e=>{setNewEmail(e.target.value);setAddErr("");}}
              onKeyDown={e=>{if(e.key==="Enter")handleAdd();}}/>
            <select style={Object.assign({},st.input,{flex:"1",minWidth:"100px"})}
              value={newRole} onChange={e=>setNewRole(e.target.value)}>
              <option value="staff">Staff</option>
              <option value="admin">Admin</option>
            </select>
          </div>
          {addErr&&<p style={{fontSize:".75rem",color:C.rust,marginBottom:".5rem"}}>⚠ {addErr}</p>}
          <button style={Object.assign({},st.btnP,{opacity:adding?0.5:1})}
            onClick={handleAdd} disabled={adding}>{adding?"Adding…":"Add"}</button>
        </div>

        {/* User list */}
        <label style={st.lbl}>Current access</label>
        {loading&&<p style={{fontSize:".8rem",color:C.tSub,padding:".75rem 0"}}>Loading…</p>}
        {err&&<p style={{fontSize:".8rem",color:C.rust,padding:".75rem 0"}}>⚠ {err}</p>}
        {!loading&&users.length===0&&<p style={{fontSize:".8rem",color:C.tSub,padding:".75rem 0"}}>No users yet.</p>}
        {!loading&&users.map(u=>(
          <div key={u.id} style={st.userRow}>
            <span style={{flex:"1",fontSize:".85rem",color:C.tBody,minWidth:"0",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{u.email}</span>
            <select
              style={{background:C.field,border:"1px solid "+C.fieldBorder,borderRadius:".5rem",padding:".35rem .6rem",color:C.tSub,fontSize:".75rem",outline:"none",cursor:"pointer",flexShrink:"0"}}
              value={u.role}
              onChange={e=>handleRoleChange(u.id,e.target.value)}>
              <option value="staff">Staff</option>
              <option value="admin">Admin</option>
            </select>
            <button style={Object.assign({},st.rmBtn,{fontSize:"1.2rem",color:C.rust})}
              onClick={()=>handleRemove(u.id,u.email)}>×</button>
          </div>
        ))}
        <p style={{fontSize:".7rem",color:C.tMuted,marginTop:"1rem"}}>
          Changes take effect on next login. Removing a person revokes future access but does not end their current session.
        </p>
      </div>
    </div>
  );
}

// ── Category manager (admin only) ─────────────────────────────────────────────
// Deleting a category moves all its recipes to "Base". "Base" is protected.
function CategoryManager({categories,recipes,onUpdated,onClose}){
  const [confirming,setConfirming] = useState(null); // category name being confirmed
  const [working,setWorking]       = useState(false);
  const [err,setErr]               = useState("");

  // Real categories only (not "All", not "Base")
  const deletable = categories.filter(c=>c!=="All"&&c!=="Base").sort();

  async function handleDelete(cat){
    setWorking(true);setErr("");
    try{
      const affected = recipes.filter(r=>r.category===cat&&!r._isDemo).map(r=>r.id);
      if(affected.length>0){
        await dbPatchMany("recipes",affected,{category:"Base"});
      }
      onUpdated(cat,affected);
      setConfirming(null);
    }catch(e){
      setErr(e.message||"Failed. Check connection.");
    }
    setWorking(false);
  }

  return (
    <div style={st.overlay} onClick={e=>{if(e.target===e.currentTarget)onClose();}}>
      <div style={st.modal}>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:"1.5rem"}}>
          <h2 style={{fontSize:"1.1rem",fontWeight:"700",color:C.tPrimary}}>Manage Categories</h2>
          <button style={st.btnGhost} onClick={onClose}>Close</button>
        </div>
        <p style={{fontSize:".78rem",color:C.tSub,marginBottom:"1.25rem",lineHeight:"1.5"}}>
          Deleting a category moves all its recipes to <strong style={{color:C.tBody}}>Base</strong>. This cannot be undone.
          The <strong style={{color:C.tBody}}>Base</strong> category is protected and cannot be deleted.
        </p>
        {err&&<div style={Object.assign({},st.errBox,{marginBottom:"1rem"})}><p style={{fontSize:".8rem",color:"#ffd0c0"}}>⚠ {err}</p></div>}
        {deletable.length===0&&(
          <p style={{fontSize:".85rem",color:C.tSub,textAlign:"center",padding:"1.5rem 0"}}>No categories to manage.</p>
        )}
        {deletable.map(cat=>{
          const count=recipes.filter(r=>r.category===cat&&!r._isDemo).length;
          const isConfirming=confirming===cat;
          return(
            <div key={cat} style={{background:C.card,border:"1px solid "+(isConfirming?"#7a3820":C.cardBorder),borderRadius:".875rem",padding:"1rem",marginBottom:".625rem",transition:"border-color .2s"}}>
              <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",gap:"1rem"}}>
                <div>
                  <p style={{fontSize:".9rem",fontWeight:"600",color:C.tPrimary}}>{cat}</p>
                  <p style={{fontSize:".72rem",color:C.tSub,marginTop:".15rem"}}>{count} recipe{count!==1?"s":""}</p>
                </div>
                {!isConfirming&&(
                  <button style={st.btnDanger} onClick={()=>{setConfirming(cat);setErr("");}}>Delete</button>
                )}
              </div>
              {isConfirming&&(
                <div style={{marginTop:".875rem",paddingTop:".875rem",borderTop:"1px solid rgba(122,56,32,0.4)"}}>
                  <p style={{fontSize:".8rem",color:"#ffd0c0",marginBottom:".75rem"}}>
                    Delete <strong>"{cat}"</strong>? {count>0?`${count} recipe${count!==1?"s":""} will move to Base.`:"No recipes will be affected."}
                  </p>
                  <div style={{display:"flex",gap:".5rem"}}>
                    <button style={Object.assign({},st.btnDangerSolid,{opacity:working?0.5:1})}
                      onClick={()=>handleDelete(cat)} disabled={working}>
                      {working?"Moving…":"Yes, delete category"}
                    </button>
                    <button style={st.btnGhost} onClick={()=>setConfirming(null)} disabled={working}>Cancel</button>
                  </div>
                </div>
              )}
            </div>
          );
        })}
      </div>
    </div>
  );
}

// ── App ───────────────────────────────────────────────────────────────────────
function App(){
  // Auth state
  const [authLoading,setAuthLoading] = useState(true);
  const [session,setSession]         = useState(null);
  const [userRole,setUserRole]       = useState(null);
  const [userEmail,setUserEmail]     = useState(null);

  // Login form state
  const [loginEmail,setLoginEmail]   = useState("");
  const [loginSent,setLoginSent]     = useState(false);
  const [loginLoading,setLoginLoading] = useState(false);
  const [loginErr,setLoginErr]       = useState("");

  // App state
  const [view,setView]           = useState("list");
  const [recipes,setRecipes]     = useState([]);
  const [dataLoading,setDataLoading] = useState(true);
  const [fetchErr,setFetchErr]   = useState("");
  const [retryCount,setRetry]    = useState(0);
  const [search,setSearch]       = useState("");
  const [filterCat,setFilter]    = useState("All");
  const [selected,setSelected]   = useState(null);
  const [showForm,setShowForm]   = useState(false);
  const [editTarget,setEdit]     = useState(null);
  const [showUsers,setShowUsers]   = useState(false);
  const [showCatMgr,setShowCatMgr] = useState(false);
  const [toast,setToast]           = useState("");

  // Batch select state
  const [batchMode,setBatchMode]     = useState(false);
  const [batchSelected,setBatchSelected] = useState([]); // array of recipe IDs
  const [batchCat,setBatchCat]       = useState("");
  const [batchWorking,setBatchWorking] = useState(false);

  const isAdmin = userRole==="admin";

  function showToast(msg){setToast(msg);setTimeout(()=>setToast(""),2500);}

  // ── Auth init ───────────────────────────────────────────────────────────────
  useEffect(()=>{
    // Check initial session (handles magic link callback via URL hash automatically)
    sbClient.auth.getSession().then(({data:{session}})=>{
      _session=session;
      setSession(session);
      if(session){setUserEmail(session.user.email);fetchRole();}
      else setAuthLoading(false);
    });

    // Keep session in sync
    const {data:{subscription}}=sbClient.auth.onAuthStateChange((event,session)=>{
      _session=session;
      setSession(session);
      if(session){setUserEmail(session.user.email);fetchRole();}
      else{setUserRole(null);setUserEmail(null);setAuthLoading(false);}
    });

    return ()=>subscription.unsubscribe();
  },[]);

  async function fetchRole(){
    try{
      const {data}=await sbClient.rpc("get_user_role");
      setUserRole(data||"staff");
    }catch(e){
      setUserRole("staff");
    }
    setAuthLoading(false);
  }

  async function handleLogin(){
    const email=loginEmail.trim().toLowerCase();
    const emailRegex=/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;
    if(!email||!emailRegex.test(email)){setLoginErr("Enter a valid email address.");return;}
    setLoginLoading(true);setLoginErr("");
    try{await sendMagicLink(email);setLoginSent(true);}
    catch(e){setLoginErr("Could not send link. Check your connection and try again.");}
    setLoginLoading(false);
  }

  async function handleSignOut(){
    await sbClient.auth.signOut();
    setView("list");setSearch("");setFilter("All");
    setSelected(null);setShowForm(false);setEdit(null);
  }

  // ── Data loading ────────────────────────────────────────────────────────────
  const load=useCallback(async()=>{
    setDataLoading(true);setFetchErr("");
    try{
      const data=await fetchRecipes();
      setRecipes(data.length>0?data:DEMO_RECIPES);
    }catch(e){
      setRecipes(DEMO_RECIPES);
      setFetchErr("Could not connect to database.");
    }
    setDataLoading(false);
  },[]);

  useEffect(()=>{if(session)load();},[session,retryCount]);

  // ── Derived ─────────────────────────────────────────────────────────────────
  const categories=["All",...[...new Set(recipes.filter(r=>!r._isDemo).map(r=>r.category).filter(Boolean))].sort()];
  const filtered=recipes.filter(r=>{
    const mc=filterCat==="All"||r.category===filterCat;
    const q=search.trim().toLowerCase();
    const ms=!q||r.name.toLowerCase().includes(q)||(r.category||"").toLowerCase().includes(q);
    return mc&&ms;
  });
  const grouped=filtered.reduce((acc,r)=>{(acc[r.category||"Other"]=acc[r.category||"Other"]||[]).push(r);return acc;},{});
  const sortedCats=Object.keys(grouped).sort();
  const showLabels=filterCat==="All"&&!search.trim();

  // ── CRUD ────────────────────────────────────────────────────────────────────
  async function handleSave(form){
    if(!isAdmin){showToast("Not authorised.");return;}
    const payload=Object.assign({},form,{property:PROPERTY});
    if(editTarget){
      const result=await dbPatch("recipes",editTarget.id,payload);
      // Supabase returns an array with return=representation
      const updated=Array.isArray(result)?result[0]:result;
      if(!updated) throw new Error("Update failed — no data returned.");
      setRecipes(prev=>prev.map(r=>r.id===editTarget.id?updated:r));
      setSelected(updated);
      showToast("Recipe updated ✓");
    }else{
      const result=await dbPost("recipes",payload);
      const created=Array.isArray(result)?result[0]:result;
      if(!created) throw new Error("Save failed — no data returned.");
      setRecipes(prev=>[...prev.filter(r=>!r._isDemo),created]);
      showToast("Recipe saved ✓");
    }
    setShowForm(false);setEdit(null);
    if(editTarget) setView("detail"); // Return to detail view so user can see the update
  }
  async function handleDelete(recipe){
    if(!isAdmin){showToast("Not authorised.");return;}
    await dbDelete("recipes",recipe.id);
    setRecipes(prev=>prev.filter(r=>r.id!==recipe.id));
    setSelected(null);setView("list");
    showToast("Recipe deleted");
  }
  function openEdit(r){setEdit(r);setShowForm(true);} // Don't change view — form overlays current page

  // ── Batch select helpers ──────────────────────────────────────────────────
  function toggleBatchSelect(id){
    setBatchSelected(prev=>prev.includes(id)?prev.filter(x=>x!==id):[...prev,id]);
  }
  function toggleSelectAll(){
    const visibleIds=filtered.filter(r=>!r._isDemo).map(r=>r.id);
    setBatchSelected(prev=>prev.length===visibleIds.length?[]:visibleIds);
  }
  function exitBatchMode(){setBatchMode(false);setBatchSelected([]);setBatchCat("");}

  async function handleBatchCategory(){
    if(!batchCat||!batchSelected.length) return;
    if(!isAdmin){showToast("Not authorised.");return;}
    setBatchWorking(true);
    try{
      await dbPatchMany("recipes",batchSelected,{category:batchCat});
      setRecipes(prev=>prev.map(r=>batchSelected.includes(r.id)?Object.assign({},r,{category:batchCat}):r));
      showToast(`${batchSelected.length} recipe${batchSelected.length!==1?"s":""} moved to ${batchCat} ✓`);
      exitBatchMode();
    }catch(e){showToast("Batch update failed — check connection.");}
    setBatchWorking(false);
  }

  // ── Category delete handler ───────────────────────────────────────────────
  function handleCategoryDeleted(deletedCat,affectedIds){
    setRecipes(prev=>prev.map(r=>affectedIds.includes(r.id)?Object.assign({},r,{category:"Base"}):r));
    if(filterCat===deletedCat) setFilter("All");
    showToast(`"${deletedCat}" deleted — ${affectedIds.length} recipe${affectedIds.length!==1?"s":""} moved to Base`);
  }

  // ── Render: loading ─────────────────────────────────────────────────────────
  if(authLoading) return (
    <div style={st.center}>
      <p style={{fontSize:".75rem",color:C.tSub,letterSpacing:".12em",textTransform:"uppercase"}}>Loading…</p>
    </div>
  );

  // ── Render: login ───────────────────────────────────────────────────────────
  if(!session) return (
    <div style={st.center}>
      <div style={{width:"100%",maxWidth:"340px"}}>
        <p style={Object.assign({},st.eyebrow,{textAlign:"center",marginBottom:".5rem"})}>{PROPERTY_NAME}</p>
        <h1 style={Object.assign({},st.h1,{textAlign:"center",marginBottom:".4rem"})}>Mise Recipes</h1>
        <p style={{fontSize:".875rem",color:C.tSub,textAlign:"center",marginBottom:"2.5rem",fontStyle:"italic"}}>kitchen recipe database</p>

        {!loginSent?(
          <div>
            <label style={st.lbl}>Email address</label>
            <input
              type="email"
              style={Object.assign({},st.input,{marginBottom:".625rem"})}
              placeholder="you@example.com"
              value={loginEmail}
              autoFocus
              autoComplete="off"
              spellCheck="false"
              onChange={e=>{setLoginEmail(e.target.value);setLoginErr("");}}
              onKeyDown={e=>{if(e.key==="Enter")handleLogin();}}
            />
            {loginErr&&<p style={{fontSize:".75rem",color:C.rust,marginBottom:".625rem"}}>⚠ {loginErr}</p>}
            <button
              style={Object.assign({},st.btnP,{width:"100%",opacity:loginLoading?0.5:1})}
              onClick={handleLogin}
              disabled={loginLoading}>
              {loginLoading?"Sending…":"Send login link →"}
            </button>
            <p style={{fontSize:".72rem",color:C.tMuted,textAlign:"center",marginTop:"1.25rem"}}>
              We'll send a one-time link to your email — no password needed.
            </p>
          </div>
        ):(
          <div style={{textAlign:"center"}}>
            <p style={{fontSize:"2rem",marginBottom:"1rem"}}>📬</p>
            <p style={{fontSize:".95rem",fontWeight:"600",color:C.tBody,marginBottom:".5rem"}}>Check your inbox</p>
            <p style={{fontSize:".85rem",color:C.tSub,marginBottom:"1.75rem",lineHeight:"1.5"}}>
              A login link has been sent to<br/>
              <strong style={{color:C.tBody}}>{loginEmail}</strong>
            </p>
            <p style={{fontSize:".75rem",color:C.tMuted}}>
              Link expires in 1 hour. Check spam if it doesn't arrive.
            </p>
            <button
              style={Object.assign({},st.btnGhost,{marginTop:"1.5rem",width:"100%"})}
              onClick={()=>{setLoginSent(false);setLoginEmail("");}}>
              Use a different email
            </button>
          </div>
        )}
      </div>
    </div>
  );

  // ── Render: detail ──────────────────────────────────────────────────────────
  if(view==="detail"&&selected) return (
    <div style={{minHeight:"100vh"}}>
      <div style={st.wrap}>
        <RecipeDetail recipe={selected} isAdmin={isAdmin}
          onBack={()=>setView("list")} onEdit={openEdit} onDelete={handleDelete}/>
      </div>
      <Toast msg={toast}/>
    </div>
  );

  // ── Render: list ────────────────────────────────────────────────────────────
  return (
    <div style={{minHeight:"100vh"}}>
      <div style={st.wrap}>

        {/* Header */}
        <div style={{display:"flex",alignItems:"flex-start",justifyContent:"space-between",marginBottom:"2rem",gap:"1rem",flexWrap:"wrap"}} className="no-print">
          <div>
            <p style={st.eyebrow}>{PROPERTY_NAME}</p>
            <h1 style={st.h1}>Recipes</h1>
          </div>
          <div style={{display:"flex",gap:".5rem",alignItems:"center",flexWrap:"wrap"}}>
            {isAdmin&&<>
              <button style={st.btnP} onClick={()=>{setEdit(null);setShowForm(true);}}>+ New Recipe</button>
              <button style={st.btnGhost} onClick={()=>setShowCatMgr(true)}>Categories</button>
              <button style={st.btnGhost} onClick={()=>setShowUsers(true)}>Manage Access</button>
            </>}
            <button style={st.btnGhost} onClick={handleSignOut} title={"Signed in as "+userEmail}>
              Sign out
            </button>
          </div>
        </div>

        {/* Connection error */}
        {fetchErr&&(
          <div style={{background:"rgba(80,20,10,0.25)",border:"1px solid rgba(180,80,60,0.35)",borderRadius:".875rem",padding:".875rem 1rem",marginBottom:"1.25rem",display:"flex",alignItems:"center",justifyContent:"space-between",gap:"1rem",flexWrap:"wrap"}}>
            <p style={{fontSize:".8rem",color:"#ffd0c0"}}>{fetchErr}</p>
            <button style={st.btnGhost} onClick={()=>setRetry(r=>r+1)} disabled={dataLoading}>
              {dataLoading?"Retrying…":"↺ Retry"}
            </button>
          </div>
        )}

        {/* Search */}
        <div style={st.searchWrap} className="no-print">
          <span style={st.searchIcon}>⌕</span>
          <input style={st.searchInput} placeholder="Search recipes…" value={search}
            onChange={e=>setSearch(e.target.value)}/>
        </div>

        {/* Category filters + Select toggle */}
        {categories.length>1&&(
          <div style={Object.assign({},st.filterRow,{alignItems:"center"})} className="no-print">
            <div style={{display:"flex",gap:".5rem",flexWrap:"wrap",flex:"1"}}>
              {categories.map(c=>(
                <button key={c} style={Object.assign({},st.chip,filterCat===c?st.chipOn:{})}
                  onClick={()=>setFilter(c)}>{c}</button>
              ))}
            </div>
            {isAdmin&&!batchMode&&(
              <button style={Object.assign({},st.btnGhost,{flexShrink:"0"})}
                onClick={()=>{setBatchMode(true);setBatchSelected([]);setBatchCat("");}}>Select</button>
            )}
          </div>
        )}

        {/* Batch action bar */}
        {isAdmin&&batchMode&&(
          <div style={{background:"rgba(10,20,8,0.7)",border:"1px solid "+C.cardBorder,borderRadius:"1rem",padding:".875rem 1rem",marginBottom:"1.25rem",display:"flex",gap:".75rem",flexWrap:"wrap",alignItems:"center"}} className="no-print">
            <button style={Object.assign({},st.chip,{flexShrink:"0"})} onClick={toggleSelectAll}>
              {batchSelected.length===filtered.filter(r=>!r._isDemo).length&&filtered.filter(r=>!r._isDemo).length>0?"Deselect all":"Select all"}
            </button>
            <span style={{fontSize:".8rem",color:C.tSub,flexShrink:"0"}}>
              {batchSelected.length} selected
            </span>
            <div style={{display:"flex",gap:".5rem",flex:"1",flexWrap:"wrap",alignItems:"center"}}>
              <select
                style={{background:C.field,border:"1px solid "+C.fieldBorder,borderRadius:".625rem",padding:".5rem .75rem",color:batchCat?C.tBody:C.tSub,fontSize:".8rem",outline:"none",flex:"1",minWidth:"120px"}}
                value={batchCat}
                onChange={e=>setBatchCat(e.target.value)}>
                <option value="">Move to category…</option>
                {categories.filter(c=>c!=="All").map(c=><option key={c} value={c}>{c}</option>)}
              </select>
              <button
                style={Object.assign({},st.btnP,{padding:".5rem 1rem",fontSize:".8rem",opacity:(batchSelected.length===0||!batchCat||batchWorking)?0.4:1})}
                disabled={batchSelected.length===0||!batchCat||batchWorking}
                onClick={handleBatchCategory}>
                {batchWorking?"Saving…":"Apply"}
              </button>
            </div>
            <button style={st.btnGhost} onClick={exitBatchMode}>Cancel</button>
          </div>
        )}

        {dataLoading&&<p style={{color:C.tSub,fontSize:".85rem",marginBottom:"1rem"}}>Loading…</p>}

        {/* Empty state */}
        {!dataLoading&&filtered.length===0&&(
          <div style={st.emptyState}>
            <p style={{fontSize:"2rem",marginBottom:".75rem"}}>🍃</p>
            <p style={{fontWeight:"600",color:C.tBody,marginBottom:".4rem"}}>
              {search||filterCat!=="All"?"No recipes found":"No recipes yet"}
            </p>
            <p style={{fontSize:".85rem"}}>
              {search||filterCat!=="All"
                ?<button style={{background:"none",border:"none",color:C.tSub,cursor:"pointer",textDecoration:"underline"}}
                    onClick={()=>{setSearch("");setFilter("All");}}>Clear filters</button>
                :isAdmin?"Add your first recipe above.":"Check back with your admin."
              }
            </p>
          </div>
        )}

        {/* Recipe list */}
        {!dataLoading&&sortedCats.map(cat=>(
          <div key={cat} style={{marginBottom:showLabels?"1.75rem":0}}>
            {showLabels&&<p style={st.catLbl}>{cat}</p>}
            {(grouped[cat]||[]).map(r=>{
              const isChecked=batchSelected.includes(r.id);
              return(
                <div key={r.id} style={{position:"relative",display:"flex",alignItems:"center",gap:".75rem",marginBottom:".625rem"}}>
                  {batchMode&&!r._isDemo&&(
                    <input type="checkbox" checked={isChecked}
                      onChange={()=>toggleBatchSelect(r.id)}
                      style={{width:"1.1rem",height:"1.1rem",accentColor:C.accent,cursor:"pointer",flexShrink:"0"}}/>
                  )}
                  <button style={Object.assign({},st.recipeCard,{marginBottom:"0",flex:"1",
                    borderColor:isChecked&&batchMode?C.accent:C.cardBorder,
                    background:isChecked&&batchMode?"rgba(212,232,184,0.08)":C.card})}
                    onClick={()=>{
                      if(batchMode&&!r._isDemo){toggleBatchSelect(r.id);}
                      else if(!batchMode){setSelected(r);setView("detail");}
                    }}
                    onMouseEnter={e=>{if(!batchMode)e.currentTarget.style.background=C.cardHov;}}
                    onMouseLeave={e=>{if(!batchMode)e.currentTarget.style.background=isChecked&&batchMode?"rgba(212,232,184,0.08)":C.card;}}>
                    <div style={{flex:"1",textAlign:"left",minWidth:"0"}}>
                      <p style={st.rName}>
                        {r.name}
                        {r._isDemo&&<span style={{fontSize:".6rem",letterSpacing:".08em",textTransform:"uppercase",marginLeft:".6rem",padding:".15rem .45rem",borderRadius:".3rem",background:"rgba(212,168,60,0.2)",color:C.amber,verticalAlign:"middle"}}>Demo</span>}
                      </p>
                      <p style={st.rMeta}>
                        {[r.yield_amount&&r.yield_unit?`Yield: ${r.yield_amount} ${r.yield_unit}`:null,
                          r.ingredients&&r.ingredients.length>0?`${r.ingredients.length} ingredients`:null]
                          .filter(Boolean).join(" · ")}
                      </p>
                    </div>
                    {!showLabels&&r.category&&<span style={st.catBadge}>{r.category}</span>}
                    {!batchMode&&<span style={{color:C.tSub,fontSize:".9rem",flexShrink:"0",marginLeft:".5rem"}}>›</span>}
                  </button>
                </div>
              );
            })}
          </div>
        ))}

      </div>

      {/* Recipe form modal */}
      {showForm&&(
        <div style={st.overlay}>
          <div style={st.modal}>
            <h2 style={{fontSize:"1.2rem",fontWeight:"700",color:C.tPrimary,marginBottom:"1.5rem"}}>
              {editTarget?"Edit Recipe":"New Recipe"}
            </h2>
            <RecipeForm
              initial={editTarget}
              categories={categories.filter(c=>c!=="All")}
              onSave={handleSave}
              onCancel={()=>{setShowForm(false);setEdit(null);}}
            />
          </div>
        </div>
      )}

      {/* User management modal */}
      {showUsers&&isAdmin&&<UserManagement onClose={()=>setShowUsers(false)}/>}

      {/* Category manager modal */}
      {showCatMgr&&isAdmin&&(
        <CategoryManager
          categories={categories}
          recipes={recipes}
          onUpdated={handleCategoryDeleted}
          onClose={()=>setShowCatMgr(false)}
        />
      )}

      <Toast msg={toast}/>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App,null));
</script>
</body>
</html>
